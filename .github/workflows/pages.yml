name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v2-founder-led/app/package-lock.json
      - name: Build Northstar v2
        working-directory: v2-founder-led/app
        env:
          VITE_API_BASE_URL: https://northstar-space-planner-v2-api.onrender.com
          VITE_BASE_PATH: /CEAI_Final/v2/
        run: npm ci && npm run build
      - name: Add v2 to Pages artifact
        run: |
          rm -rf public/v2
          mkdir -p public/v2
          cp -R v2-founder-led/app/dist/. public/v2/
      - name: Upload static frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
